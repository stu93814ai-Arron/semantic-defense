# 權威閘門：pnpm run ci → scripts/ci.sh（凍結安裝、必跑測試與覆蓋率、型別、lint、
# 重複碼、audit、gitleaks 歷史掃描、平面邊界、SBOM、E2E）。
# 不可改成 `pnpm ci`：那是 pnpm 的 clean-install，不會執行 scripts/ci.sh。
# 動作版本與出處：docs/provenance/ALLOWED-GITHUB-ACTIONS.md
# 快轉與線性歷史的差別：docs/ci/github-actions.md
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4

      - name: pin pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.33.4 --activate
          node -v
          pnpm -v

      - name: reject model endpoints and bypasses
        env:
          SKIP_E2E: "0"
        run: |
          set -euo pipefail
          # 只允許官方 npm registry。不設定、不使用任何鏡像。
          reg="${npm_config_registry:-${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}}"
          case "$reg" in
            https://registry.npmjs.org|https://registry.npmjs.org/) ;;
            *) echo "CI 只允許 https://registry.npmjs.org/"; exit 1 ;;
          esac
          if [ -n "${PLAYWRIGHT_DOWNLOAD_HOST:-}" ]; then
            echo "CI 禁止覆寫 PLAYWRIGHT_DOWNLOAD_HOST"
            exit 1
          fi
          for v in \
            GROK_API_KEY XAI_API_KEY OPENAI_API_KEY OPENAI_BASE_URL \
            OLLAMA_HOST OLLAMA_MODELS INTENT_MODEL_URL INTENT_MODEL_NAME \
            HUGGING_FACE_HUB_TOKEN HF_TOKEN
          do
            if [ -n "${!v:-}" ]; then
              echo "CI 禁止設定模型端點或權杖：$v"
              exit 1
            fi
          done
          if [ "${SKIP_E2E:-0}" = "1" ]; then
            echo "CI 禁止 SKIP_E2E=1"
            exit 1
          fi

      - name: frozen install
        run: pnpm install --frozen-lockfile

      # 瀏覽器與系統相依放在腳本的 E2E 計時之外，避免下載時間吃掉既有 180 秒上限。
      # scripts/e2e.sh 仍會自己挑隨機埠、取得 flock，並再執行 playwright install。
      - name: install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: authoritative gate
        env:
          SKIP_E2E: "0"
        run: pnpm run ci
