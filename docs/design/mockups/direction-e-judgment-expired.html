<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><style>:root{--color-bg:#FAF8F5;--color-surface:#FFFFFF;--color-surface-2:#F1EDE8;--color-border:#E2DCD4;--color-text:#1E1C1A;--color-text-muted:#5E5751;--color-primary:#A4472C;--color-danger:#A3262A;--color-warning:#87570F;--color-success:#3B6B52;--color-info:#3B5675;--color-neutral:#6A635D;--radius-md:0px;--font-serif:"Playfair Display","Noto Serif CJK TC","Noto Serif TC",serif}
*{box-sizing:border-box}body{margin:0;width:1440px;height:900px;background-color:var(--color-bg);background-image:linear-gradient(115deg,transparent 40%,rgba(160,150,140,.07) 45%,transparent 52%),linear-gradient(28deg,transparent 60%,rgba(150,140,130,.06) 63%,transparent 68%);color:var(--color-text);font:15px/1.75 "Noto Sans CJK TC","Noto Sans TC",sans-serif;overflow:hidden;letter-spacing:.02em}
.serif{font-family:var(--font-serif);font-weight:500}h1{font-family:var(--font-serif);font-weight:500;font-size:40px;margin:0 0 8px;letter-spacing:.04em}
.eyebrow{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--color-text-muted)}
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:32px}
.btn{display:inline-block;padding:14px 32px;border-radius:0;font-weight:500;letter-spacing:.1em;border:1px solid var(--color-text)}
.p{background:var(--color-primary);border-color:var(--color-primary);color:#FFFFFF}.o{color:var(--color-danger);border-color:var(--color-danger);background:transparent}.g{background:var(--color-surface-2);color:var(--color-neutral);border-color:var(--color-border)}
.tag{display:inline-block;padding:2px 14px;border-radius:0;font-size:13px;font-weight:500}
.td{color:var(--color-danger);background:color-mix(in srgb,var(--color-danger) 10%,var(--color-surface))}.tw{color:var(--color-warning);background:color-mix(in srgb,var(--color-warning) 12%,var(--color-surface))}.ts{color:var(--color-success);background:color-mix(in srgb,var(--color-success) 12%,var(--color-surface))}.ti{color:var(--color-info);background:color-mix(in srgb,var(--color-info) 10%,var(--color-surface))}.tm{color:var(--color-neutral);background:var(--color-surface-2)}
.mu{color:var(--color-text-muted)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:20px 16px;border-bottom:1px solid var(--color-border)}th{font-weight:400;font-size:12px;letter-spacing:.2em;color:var(--color-text-muted)}
.banner{padding:18px 24px;border-radius:var(--radius-md);margin-bottom:28px;display:flex;gap:14px;align-items:center;border:1px solid}
.bd{color:var(--color-danger);border-color:var(--color-danger);background:color-mix(in srgb,var(--color-danger) 7%,var(--color-surface))}.bw{color:var(--color-warning);border-color:var(--color-warning);background:color-mix(in srgb,var(--color-warning) 8%,var(--color-surface))}.bn{color:var(--color-text);border-color:var(--color-neutral);background:var(--color-surface-2)}
.banner b{font-family:var(--font-serif);font-size:18px}</style></head><body><header style="height:84px;display:flex;align-items:center;padding:0 96px;border-bottom:1px solid var(--color-border);background:var(--color-surface)"><span class="serif" style="font-size:24px;letter-spacing:.12em">SEMANTICA <span style="font-size:16px" class="mu">應用語意防禦</span></span><nav style="margin-left:auto;display:flex;gap:40px"><span style="border-bottom:2px solid var(--color-primary);color:var(--color-primary);padding-bottom:4px">待判斷</span><span style="color:var(--color-text-muted);padding-bottom:4px">判斷紀錄</span><span style="color:var(--color-text-muted);padding-bottom:4px">生效限制</span><span style="color:var(--color-text-muted);padding-bottom:4px">緊急暫停</span><span class="mu">王小明</span></nav></header><main style="padding:56px 96px"><div class="eyebrow">待判斷 / C-1042</div><div class="banner bn"><b>限制已到期</b><span>此限制已於 22:40 到期（或已被撤回），僅供檢視。</span></div><div style="display:flex;gap:40px">
<div style="flex:1"><h1>C-1042 · 訂單系統</h1><span class="tag td">高風險</span><div style="margin:32px 0 10px" class="eyebrow">偏移路徑</div><p>/orders/{id}（讀取） → /admin/members/export（管理）</p>
<div class="eyebrow" style="margin:28px 0 10px">AI 建議的限制</div><div class="card" style="background:var(--color-surface-2)"><div class="serif" style="font-size:22px;line-height:1.5">禁止此工作階段呼叫<br>/admin/members/export，為期 30 分鐘</div><p class="mu" style="margin:12px 0 0">變形測試：五種說法皆落在同一條限制 ✓</p></div><div style="margin-top:36px;display:flex;gap:16px"><span class="btn g">核准並簽名</span><span class="btn g">退回</span></div></div>
<div class="card" style="width:340px;text-align:center;align-self:flex-start;padding:44px 32px"><div class="eyebrow">距成案</div><div style="margin:20px 0"><div class="serif" style="font-size:64px;line-height:1.3">—</div></div><div style="height:4px;background:var(--color-surface-2);border-radius:9px"><div style="height:4px;width:100%;background:var(--color-neutral);border-radius:9px"></div></div><p style="margin-top:24px"><span class="tag tm">已到期</span></p><p class="mu" style="font-size:13px">七秒內應出現可核准判斷</p></div></div></main></body></html>
