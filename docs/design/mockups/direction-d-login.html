<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><style>:root{--color-bg:#F4EFE6;--color-surface:#FBF8F2;--color-surface-2:#ECE4D6;--color-border:#D9CDB8;--color-text:#2E2A24;--color-text-muted:#5F574B;--color-primary:#4F6B57;--color-danger:#9E3B2C;--color-warning:#8A5A12;--color-success:#3F6B4A;--color-info:#3E5F78;--color-neutral:#6B6358;--radius-md:18px;--font-serif:"Cormorant Garamond","Noto Serif CJK TC","Noto Serif TC",serif}
*{box-sizing:border-box}body{margin:0;width:1440px;height:900px;background-color:var(--color-bg);background-image:radial-gradient(rgba(120,95,60,.05) 1px,transparent 1px),repeating-linear-gradient(90deg,rgba(150,110,60,.025) 0 2px,transparent 2px 7px);background-size:5px 5px,auto;color:var(--color-text);font:15px/1.75 "Noto Sans CJK TC","Noto Sans TC",sans-serif;overflow:hidden;letter-spacing:.02em}
.serif{font-family:var(--font-serif);font-weight:600}h1{font-family:var(--font-serif);font-weight:600;font-size:40px;margin:0 0 8px;letter-spacing:.04em}
.eyebrow{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--color-text-muted)}
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:32px}
.btn{display:inline-block;padding:14px 32px;border-radius:999px;font-weight:500;letter-spacing:.1em;border:1px solid var(--color-text)}
.p{background:var(--color-primary);border-color:var(--color-primary);color:#FFFFFF}.o{color:var(--color-danger);border-color:var(--color-danger);background:transparent}.g{background:var(--color-surface-2);color:var(--color-neutral);border-color:var(--color-border)}
.tag{display:inline-block;padding:2px 14px;border-radius:999px;font-size:13px;font-weight:500}
.td{color:var(--color-danger);background:color-mix(in srgb,var(--color-danger) 10%,var(--color-surface))}.tw{color:var(--color-warning);background:color-mix(in srgb,var(--color-warning) 12%,var(--color-surface))}.ts{color:var(--color-success);background:color-mix(in srgb,var(--color-success) 12%,var(--color-surface))}.ti{color:var(--color-info);background:color-mix(in srgb,var(--color-info) 10%,var(--color-surface))}.tm{color:var(--color-neutral);background:var(--color-surface-2)}
.mu{color:var(--color-text-muted)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:20px 16px;border-bottom:1px solid var(--color-border)}th{font-weight:400;font-size:12px;letter-spacing:.2em;color:var(--color-text-muted)}
.banner{padding:18px 24px;border-radius:var(--radius-md);margin-bottom:28px;display:flex;gap:14px;align-items:center;border:1px solid}
.bd{color:var(--color-danger);border-color:var(--color-danger);background:color-mix(in srgb,var(--color-danger) 7%,var(--color-surface))}.bw{color:var(--color-warning);border-color:var(--color-warning);background:color-mix(in srgb,var(--color-warning) 8%,var(--color-surface))}.bn{color:var(--color-text);border-color:var(--color-neutral);background:var(--color-surface-2)}
.banner b{font-family:var(--font-serif);font-size:18px}</style></head><body><div style="display:flex;height:900px"><div style="flex:1;background:linear-gradient(180deg,#D2B288,#C6A072);position:relative"><div style="position:absolute;inset:0;background:repeating-linear-gradient(92deg,rgba(90,60,30,.08) 0 3px,transparent 3px 19px)"></div><div style="position:absolute;left:80px;bottom:90px;color:#2E2A24"><div class="serif" style="font-size:56px;line-height:1.2">安靜地<br>守護每一次請求</div><div class="eyebrow" style="color:#33291F;margin-top:16px">Semantic Defense · Est. 2026</div></div></div>
<div style="width:620px;display:flex;align-items:center;justify-content:center"><div style="width:400px"><div class="eyebrow">Welcome back</div><h1>值勤登入</h1><p class="mu">請以公司帳號登入。所有操作將留存稽核紀錄。</p>
<div class="banner bn" style="margin:24px 0">工作階段已逾時，請重新登入。</div>
<div class="mu" style="font-size:13px">帳號</div><div class="card" style="padding:14px 20px;margin:6px 0 18px;border-radius:14px">wang.xm@corp</div>
<div class="mu" style="font-size:13px">密碼</div><div class="card" style="padding:14px 20px;margin:6px 0 28px;border-radius:14px;outline:2px solid var(--color-primary);outline-offset:3px">••••••••••</div>
<div class="btn p" style="width:100%;text-align:center">登入</div></div></div></div></body></html>
